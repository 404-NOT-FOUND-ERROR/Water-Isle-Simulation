<div id="app"></div>
<section id="panel" aria-label="浮屿工坊控制面板">

  <div class="rule"></div>

  <label for="time">昼夜时间 <span id="timeLabel" class="value">10:30</span></label><input id="time" type="range" min="0" max="24" step="0.05" value="10.5"/>
  <div class="weather-row"><label for="weather">天气</label><select id="weather" class="field" aria-label="选择天气"><option value="clear">晴朗</option><option value="cloudy">多云</option><option value="rain">细雨</option><option value="snow">落雪</option><option value="stardust">星辉</option></select></div>
  <label for="vehicle" style="margin-top:12px">出行方式</label><div class="row"><select id="vehicle" class="field grow" aria-label="选择载具"><option value="cart">林叶邮车</option><option value="bus">云铃小巴</option><option value="airship">星帆艇</option></select><button id="summon" class="teal">召回</button></div>
  <div class="row"><button id="ride" class="secondary">步行 · V 附近乘车</button></div><div class="small">WASD / 方向键行走或驾驶 · V 上下车<br>星帆艇：空格上升 · Shift 下降</div>
  <label for="zoom" style="margin-top:10px">视野 <span class="small">近看 ↔ 远眺</span></label><input id="zoom" type="range" min="52" max="132" step="2" value="86" aria-label="视野缩放"/>
  <details id="workshop"><summary>营地工坊 · 塑形与制作</summary>
  <div class="row"><button id="raise" class="secondary grow">抬升地形</button><button id="lower" class="secondary grow">降低地形</button><button id="smooth" class="secondary grow">平滑地形</button></div>
  <div class="rule"></div>
  <div class="chips"><div class="chip"><span class="swatch" style="background:#c48a52"></span>木材<b id="wood">0</b></div><div class="chip"><span class="swatch" style="background:#8a8d82"></span>石头<b id="stone">0</b></div><div class="chip"><span class="swatch" style="background:#ffca45"></span>种子<b id="seedCount">0</b></div></div>
  <div class="row"><button id="campfire" class="teal grow">制作篝火 <span class="small">3木·2石</span></button><button id="bench" class="teal grow">制作长凳 <span class="small">4木·1石</span></button></div>
  <div class="row"><button id="plant" class="secondary grow">种下花种</button><span class="small grow">岛屿心愿：点亮营地，再让花朵在坡地扎根。</span></div>
  </details>
</section>
<div id="hint"><b>岛屿日记</b><span id="progress">找到木材、石头与发光种子，给岛屿添一处温暖的落脚点。</span><span id="locationStatus">云铃镇 · 晴朗 · 10:30</span></div>
<div id="touchControls" aria-label="触屏控制"><div class="pad"><button data-dir="up" aria-label="向前">↑</button><button data-dir="left" aria-label="向左">←</button><button data-dir="down" aria-label="向后">↓</button><button data-dir="right" aria-label="向右">→</button></div><div class="touch-actions"><button data-action="jump" aria-label="跳跃">跳跃</button><button data-action="collect" aria-label="采集">采集</button><button data-action="plant" aria-label="种植">种植</button><button data-action="ride" aria-label="乘坐载具">乘车</button></div></div>
<div id="toast" role="status"></div><div id="reticle"><i class="reticle-line h"></i><i class="reticle-line v"></i></div>

  function makeGroundDisc(x, z, radius, material) {

      positions.setY(i, terrainHeight(x + positions.getX(i), z + positions.getZ(i)) + .035);
      positions.setX(i, positions.getX(i) + x);
      positions.setZ(i, positions.getZ(i) + z);

    geometry.computeVertexNormals();

  function ribbonGeometry(points, halfWidth, heightOffset) {
    const vertices = [], indices = [];
    for (let i = 0; i < points.length; i++) {
      const point = points[i], previous = points[Math.max(0, i - 1)];
      const next = points[Math.min(points.length - 1, i + 1)];
      const dx = next.x - previous.x, dz = next.z - previous.z;
      const length = Math.hypot(dx, dz) || 1, nx = -dz / length, nz = dx / length;
      for (const side of [-1, 1]) {
        const x = point.x + nx * halfWidth * side, z = point.z + nz * halfWidth * side;
        vertices.push(x, terrainHeight(x, z) + heightOffset, z);
      }
      if (i < points.length - 1) {
        const n = i * 2;
        indices.push(n, n + 2, n + 1, n + 1, n + 2, n + 3);
      }
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
    geometry.setIndex(indices); geometry.computeVertexNormals();
    return geometry;
  }

  function roadMarkGeometry(points, type, width) {
    const vertices = [], indices = [];
    for (let i = 2; i < points.length - 2; i += type === 'wood' ? 2 : 5) {
      const a = points[i], b = points[Math.min(points.length - 1, i + (type === 'wood' ? 1 : 2))];
      const dx = b.x - a.x, dz = b.z - a.z, length = Math.hypot(dx, dz) || 1;
      const half = type === 'wood' ? width * .44 : .065;
      const nx = -dz / length * half, nz = dx / length * half;
      const base = vertices.length / 3;
      for (const [point, side] of [[a, -1], [a, 1], [b, -1], [b, 1]]) {
        const x = point.x + nx * side, z = point.z + nz * side;
        vertices.push(x, terrainHeight(x, z) + .112, z);
      }
      indices.push(base, base + 2, base + 1, base + 1, base + 2, base + 3);
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
    geometry.setIndex(indices); geometry.computeVertexNormals();
    return geometry;
  }

  function makeRoad(id, anchors, type = 'stone', width = 2, closed = false) {
    const curve = new THREE.CatmullRomCurve3(anchors.map(point => new THREE.Vector3(point[0], 0, point[1])), closed, 'centripetal');
    const points = curve.getPoints(Math.max(28, Math.ceil(curve.getLength() / .48)));
    const materials = type === 'star'
      ? [fantasyPalette.starRoad, fantasyPalette.starEdge, fantasyPalette.gold]
      : type === 'wood'
        ? [fantasyPalette.timber, fantasyPalette.timberEdge, fantasyPalette.paleStone]
        : [mats.road, fantasyPalette.paleStone, fantasyPalette.gold];
    const shoulder = new THREE.Mesh(ribbonGeometry(points, width / 2 + .22, .048), materials[1]);
    const mesh = new THREE.Mesh(ribbonGeometry(points, width / 2, .082), materials[0]);
    const markings = new THREE.Mesh(roadMarkGeometry(points, type, width), materials[2]);
    for (const part of [shoulder, mesh, markings]) {
      part.receiveShadow = true; part.userData.fantasyRoad = true; addProp(part);
    }
    roads.push({id, type, width, points, mesh, shoulder, markings});
    return mesh;
  }

    makeRoad('mushroom-path', [[9, 7], [9, 11.9], [5, 15], [-2, 16.3], [-10.6, 16.6]], 'wood', 1.9);

    makeRoad('station-path', [[2, .6], [3.6, -2.8], [7.2, -4.2], [13.2, -4.2]], 'stone', 2.2);
    for (let i = 0; i < 6; i++) {

    for (const [x, z] of [[-7, -3.3], [-13.6, -6], [5, 14.1], [-3, 15.3], [16.5, 10.2]]) makeLantern(x, z);

        for (const wheelZ of isBus ? [-1.04, 1.04] : [-.42, .6]) {

        }

  function buildFantasyWorld() {
    fantasyBuildings.length = 0; fantasyFloaters.length = 0;
    const town = makeTown();
    makeRoads(town); makeScenery();
    makeFantasyVehicle('cart', 2.2, -1.4);
    makeFantasyVehicle('bus', 7.8, -5.1);
    makeFantasyVehicle('airship', 13, -5.2);
  }

  function resolveTownCollision(position, previous = position, radius = .5) {
    let collided = false;
    for (let pass = 0; pass < 2; pass++) for (const building of fantasyBuildings) {
      if (position.y > building.group.position.y + building.height + .65) continue;
      const dx = position.x - building.x, dz = position.z - building.z;
      const distance = Math.hypot(dx, dz), limit = building.radius + radius;
      if (distance >= limit) continue;
      let nx = dx, nz = dz, length = distance;
      if (length < .001) {
        nx = previous.x - building.x; nz = previous.z - building.z;
        length = Math.hypot(nx, nz) || 1;
        if (nx === 0 && nz === 0) nx = 1;
      }
      position.x = building.x + nx / length * limit;
      position.z = building.z + nz / length * limit;
      collided = true;
    }
    return collided;
  }

  function activeFantasyVehicle() {
    return vehicles.find(vehicle => vehicle.id === state.riding || vehicle.name === state.riding);
  }

  function selectedFantasyVehicle() {
    return vehicles.find(vehicle => vehicle.id === $('vehicle')?.value) || vehicles[0];
  }

  function nearestVehicle() {
    if (!player) return null;
    const candidates = vehicles.filter(vehicle => vehicle.group.parent &&
      Math.hypot(player.position.x - vehicle.group.position.x, player.position.z - vehicle.group.position.z) < (vehicle.id === 'airship' ? 4.6 : 3.6));
    const selected = selectedFantasyVehicle();
    if (candidates.includes(selected)) return selected;
    candidates.sort((a, b) => player.position.distanceToSquared(a.group.position) - player.position.distanceToSquared(b.group.position));
    return candidates[0] || null;
  }

  function syncFantasyRider(vehicle) {
    if (!player || !vehicle?.mounted) return;
    player.position.copy(vehicle.group.position);
    player.position.y += vehicle.seatHeight;
    player.rotation.y = vehicle.group.rotation.y;
  }

  function moveFantasyVehicle(dt) {
    const vehicle = activeFantasyVehicle();
    if (!vehicle || !player) return false;
    vehicle.mounted = true; state.riding = vehicle.id;
    let x = 0, z = 0;
    if (keys.has('KeyW') || keys.has('ArrowUp')) z--;
    if (keys.has('KeyS') || keys.has('ArrowDown')) z++;
    if (keys.has('KeyA') || keys.has('ArrowLeft')) x--;
    if (keys.has('KeyD') || keys.has('ArrowRight')) x++;
    const length = Math.hypot(x, z) || 1, group = vehicle.group;
    const previous = group.position.clone();
    group.position.x += x / length * vehicle.speed * dt;
    group.position.z += z / length * vehicle.speed * dt;
    const radius = Math.hypot(group.position.x, group.position.z);
    if (radius > 39) { group.position.x *= 39 / radius; group.position.z *= 39 / radius; }
    if (vehicle.id === 'airship') {
      if (keys.has('Space')) vehicle.altitude += dt * 4;
      if (keys.has('ShiftLeft') || keys.has('ShiftRight')) vehicle.altitude -= dt * 4;
      vehicle.altitude = THREE.MathUtils.clamp(vehicle.altitude, 3, 14);
    }
    group.position.y = terrainHeight(group.position.x, group.position.z) +
      (vehicle.id === 'airship' ? vehicle.altitude : vehicle.groundOffset);
    resolveTownCollision(group.position, previous, vehicle.radius);
    group.position.y = terrainHeight(group.position.x, group.position.z) +
      (vehicle.id === 'airship' ? vehicle.altitude : vehicle.groundOffset);
    vehicle.lastTravel = Math.hypot(group.position.x - previous.x, group.position.z - previous.z);
    vehicle.distance += vehicle.lastTravel;
    if (x || z) group.rotation.y = Math.atan2(x, z);
    syncFantasyRider(vehicle);
    return true;
  }

  function updateVehicles(dt, t = elapsed) {
    for (const vehicle of vehicles) {
      const group = vehicle.group;
      if (!group?.parent) continue;
      const offset = vehicle.id === 'airship' ? vehicle.altitude : vehicle.groundOffset;
      group.position.y = terrainHeight(group.position.x, group.position.z) + offset;
      if (vehicle.id === 'airship') {
        if (!vehicle.mounted) group.position.y += Math.sin(t * 1.15) * .13;
        vehicle.propeller.rotation.z += dt * (vehicle.mounted ? 15 : 3);
      }
      for (const wheel of vehicle.wheels) wheel.rotation.z = -vehicle.distance / (vehicle.id === 'bus' ? .43 : .36);
      syncFantasyRider(vehicle);
    }
  }

  function findFantasyParking(x, z, heading = 0, radius = .6) {
    for (let i = 0; i < 10; i++) {
      const angle = heading + Math.PI / 2 + i * TAU / 10;
      const candidate = new THREE.Vector3(x + Math.sin(angle) * 2.7, 0, z + Math.cos(angle) * 2.7);
      if (Math.hypot(candidate.x, candidate.z) > 38) continue;
      candidate.y = terrainHeight(candidate.x, candidate.z);
      const collision = fantasyBuildings.some(building => Math.hypot(candidate.x - building.x, candidate.z - building.z) < building.radius + radius + .25);
      if (!collision) return candidate;
    }
    const fallback = new THREE.Vector3(x, terrainHeight(x, z), z);
    resolveTownCollision(fallback, fallback.clone(), radius);
    fallback.y = terrainHeight(fallback.x, fallback.z);
    return fallback;
  }

  function toggleRide() {
    if (!player) return;
    const mounted = activeFantasyVehicle();
    if (mounted) {
      const landing = findFantasyParking(mounted.group.position.x, mounted.group.position.z,
        mounted.group.rotation.y, .55);
      mounted.mounted = false; state.riding = ''; player.visible = true; player.position.copy(landing);
      player.position.y += .03;
      keys.delete('Space'); keys.delete('ShiftLeft'); keys.delete('ShiftRight');
      toast('已离开' + mounted.name + '，回到地面步行');
    } else {
      const vehicle = nearestVehicle();
      if (!vehicle) {
        toast('靠近载具按 V；可用“召回”让选中载具停到身旁');
        updateRideUI(); return;
      }
      for (const item of vehicles) item.mounted = item === vehicle;
      state.riding = vehicle.id;
      player.visible = false;
      if ($('vehicle')) $('vehicle').value = vehicle.id;
      syncFantasyRider(vehicle);
      toast(vehicle.id === 'airship'
        ? '已登上星帆艇：WASD 航行 · 空格升高 · Shift 降低 · V 下艇'
        : '已乘坐' + vehicle.name + '：WASD 驾驶 · V 下车');
    }
    updateRideUI();
  }

  function summonVehicle() {
    if (!player) return;
    if (activeFantasyVehicle()) { toast('先按 V 下车，再召回其他载具'); return; }
    const vehicle = selectedFantasyVehicle();
    if (!vehicle) return;
    const parking = findFantasyParking(player.position.x, player.position.z, player.rotation.y, vehicle.radius);
    vehicle.group.position.copy(parking); vehicle.group.rotation.y = player.rotation.y;
    if (vehicle.id === 'airship') vehicle.altitude = 3;
    vehicle.group.position.y += vehicle.id === 'airship' ? vehicle.altitude : vehicle.groundOffset;
    vehicle.mounted = false; vehicle.lastTravel = 0;
    toast(vehicle.name + '已停靠身旁，靠近按 V 乘坐'); updateRideUI();
  }

  function updateRideUI() {
    const button = $('ride');
    if (!button || !player) return;
    const mounted = activeFantasyVehicle(), nearby = nearestVehicle();
    button.textContent = mounted ? '离开' + mounted.name + ' · V' : nearby ? '乘坐' + nearby.name + ' · V' : '靠近载具乘坐 · V';
    button.classList.toggle('ride-nearby', !!(mounted || nearby));
    const selected = selectedFantasyVehicle();
    if (selected) {
      const dx = selected.group.position.x - player.position.x, dz = selected.group.position.z - player.position.z;
      const direction = Math.abs(dx) < 1.4 && Math.abs(dz) < 1.4 ? '身旁' :
        (dz < -1.4 ? '北' : dz > 1.4 ? '南' : '') + (dx > 1.4 ? '东' : dx < -1.4 ? '西' : '');
      const hint = selected.name + ' · ' + direction + '约 ' + Math.round(Math.hypot(dx, dz)) + ' 米' +

  function captureVehicles() {
    return vehicles.map(vehicle => ({id: vehicle.id, x: vehicle.group.position.x,
      z: vehicle.group.position.z, heading: vehicle.group.rotation.y, altitude: vehicle.altitude}));

  function restoreVehicles(data) {
    if (Array.isArray(data)) for (const saved of data) {
      const vehicle = vehicles.find(item => item.id === saved?.id);
      if (!vehicle || !Number.isFinite(saved.x) || !Number.isFinite(saved.z)) continue;
      const radius = Math.hypot(saved.x, saved.z), scale = radius > 39 ? 39 / radius : 1;
      vehicle.group.position.x = saved.x * scale; vehicle.group.position.z = saved.z * scale;
      vehicle.group.rotation.y = Number.isFinite(saved.heading) ? saved.heading : 0;
      vehicle.altitude = vehicle.id === 'airship' && Number.isFinite(saved.altitude)
        ? THREE.MathUtils.clamp(saved.altitude, 3, 14) : vehicle.id === 'airship' ? 3 : 0;
      vehicle.group.position.y = terrainHeight(vehicle.group.position.x, vehicle.group.position.z) +
        (vehicle.id === 'airship' ? vehicle.altitude : vehicle.groundOffset);
      resolveTownCollision(vehicle.group.position, vehicle.group.position.clone(), vehicle.radius);
    }
    const active = activeFantasyVehicle();
    state.riding = active?.id || '';
    for (const vehicle of vehicles) vehicle.mounted = vehicle === active;
    if (player) player.visible = !active;
    updateVehicles(0); updateRideUI();
  }

  function refreshFantasyGround() {
    for (const prop of props) {
      if (prop.userData.fantasyGround === undefined) continue;
      if (prop.userData.fantasyRoad || prop.userData.groundDisc) prop.position.set(0, 0, 0);
      else prop.position.y = terrainHeight(prop.position.x, prop.position.z) + prop.userData.fantasyGround;
      if (prop.userData.groundDisc) {
        const positions = prop.geometry.attributes.position;
        for (let i = 0; i < positions.count; i++) positions.setY(i,
          terrainHeight(positions.getX(i), positions.getZ(i)) + .035);
        positions.needsUpdate = true; prop.geometry.computeVertexNormals();
      }
    }
    for (const road of roads) {
      const replacements = [ribbonGeometry(road.points, road.width / 2 + .22, .048),
        ribbonGeometry(road.points, road.width / 2, .082), roadMarkGeometry(road.points, road.type, road.width)];
      [road.shoulder, road.mesh, road.markings].forEach((mesh, i) => {
        mesh.geometry.dispose(); mesh.geometry = replacements[i]; mesh.position.set(0, 0, 0);
      });
    }
    updateVehicles(0);
  }

  function updateFantasyWorld(dt, t = elapsed, nightAmount = 0) {
    const night = THREE.MathUtils.clamp(nightAmount, 0, 1);
    for (const lamp of lanterns) {
      lamp.mesh.material.emissiveIntensity = .1 + night * (1.7 + Math.sin(t * 1.7 + lamp.phase) * .16);
    }
    fantasyPalette.crystal.emissiveIntensity = .16 + night * .85;
    fantasyPalette.lilacCrystal.emissiveIntensity = .12 + night * .8;
    fantasyPalette.starRoad.emissiveIntensity = .08 + night * .8;
    for (const item of fantasyFloaters) {
      if (item.kind === 'firefly') {
        item.mesh.position.set(item.x + Math.sin(t * .7 + item.phase) * .48,
          terrainHeight(item.x, item.z) + 1.5 + Math.sin(t * 1.3 + item.phase) * .42,
          item.z + Math.cos(t * .58 + item.phase) * .4);
        item.mesh.scale.setScalar(.55 + night * .65);
      } else if (item.kind === 'rune') {
        item.mesh.rotation.z = t * .28; item.mesh.position.y = 2.1 + Math.sin(t * 1.5) * .13;
      } else if (item.kind === 'bell') {
        item.mesh.rotation.y = t * .45; item.mesh.position.y = 1.42 + Math.sin(t * 1.1) * .14;
      }
    }
    for (const resident of residents) {
      const angle = resident.phase + t * resident.speed;
      resident.group.position.x = 9 + Math.cos(angle) * 2.75;
      resident.group.position.z = 5 + Math.sin(angle) * 2.75;
      resident.group.position.y = terrainHeight(resident.group.position.x, resident.group.position.z) + Math.abs(Math.sin(t * 5)) * .035;
      resident.group.rotation.y = -angle;
    }
    updateVehicles(dt, t);
  }

  function timeText(t){const h=Math.floor(t)%24,m=Math.floor((t-Math.floor(t))*60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
  function setTime(t){state.time=((t%24)+24)%24;$('time').value=state.time;$('timeLabel').textContent=timeText(state.time)}
  let nightAmount=1;
  function setWeather(value,announce=true){const valid=['clear','cloudy','rain','snow','stardust'];state.weather=valid.includes(value)?value:'clear';const select=$('weather');if(select&&select.value!==state.weather)select.value=state.weather;if(weatherEffect){for(const item of weatherEffect.children){if(item.name==='rain')item.visible=state.weather==='rain';if(item.name==='snow')item.visible=state.weather==='snow';if(item.name==='stardust'||item.name==='aurora')item.visible=state.weather==='stardust'}}if(announce)toast('天气：'+({clear:'晴朗',cloudy:'多云',rain:'细雨',snow:'落雪',stardust:'星辉'}[state.weather]));updateLocationStatus();return state.weather}
  function updateLighting(dt){if(state.autoTime&&dt>0)setTime(state.time+dt*.16);const hour=state.time,angle=(hour/24)*TAU-Math.PI/2,sunY=Math.sin(angle);let daylight=THREE.MathUtils.clamp((sunY+.12)/.38,0,1);daylight=daylight*daylight*(3-2*daylight);nightAmount=1-daylight;const dawn=THREE.MathUtils.clamp(1-Math.abs(hour-6)/2.4,0,1),dusk=THREE.MathUtils.clamp(1-Math.abs(hour-18)/2.4,0,1),twilight=Math.max(dawn,dusk);sun.position.set(Math.cos(angle)*34,sunY*35+6,Math.sin(angle*.75)*26);sun.target.position.set(0,0,0);const sky=new THREE.Color(0x17264b).lerp(new THREE.Color(0xbfe9e0),daylight);sky.lerp(new THREE.Color(0xf0a178),twilight*.72);if(state.weather==='cloudy')sky.lerp(new THREE.Color(0x7b939c),.25);if(state.weather==='rain')sky.lerp(new THREE.Color(0x526f88),.46);if(state.weather==='snow')sky.lerp(new THREE.Color(0xb8d5df),.28);if(state.weather==='stardust')sky.lerp(new THREE.Color(0x233868),nightAmount*.43);scene.background.copy(sky);scene.fog.color.copy(sky);const fog={clear:[45,136],cloudy:[36,112],rain:[28,94],snow:[32,106],stardust:[40,122]}[state.weather]||[45,136];scene.fog.near=fog[0];scene.fog.far=fog[1];const dim={clear:1,cloudy:.78,rain:.62,snow:.88,stardust:.94}[state.weather]||1;sun.intensity=.02+daylight*2.55*dim+twilight*.18;sun.color.set(state.weather==='snow'?0xdde9ff:twilight>.3?0xffb17d:0xffedcb);hemi.intensity=.12+daylight*1.02*dim+nightAmount*.1;hemi.color.set(nightAmount>.6?0x7189b2:0xfff3db);hemi.groundColor.set(nightAmount>.6?0x35506c:0x5d887e);ambient.intensity=.07+daylight*.24+nightAmount*.08;ambient.color.set(nightAmount>.5?0x8ea8c7:0xffefc4);mats.water.color.set(state.weather==='rain'?0x4e91a4:state.weather==='snow'?0x9bc1cb:0x75d7d0);mats.cloud.color.set(state.weather==='rain'?0x8999a7:state.weather==='cloudy'?0xb5c0be:state.weather==='snow'?0xd6e4e4:0xfdfdf8);if(weatherEffect){const center=player||{position:{x:0,z:0}},originX=center.position.x,originZ=center.position.z;weatherEffect.position.set(originX,0,originZ);const stars=weatherEffect.getObjectByName('stars'),moon=weatherEffect.getObjectByName('moon'),halo=weatherEffect.getObjectByName('moon-halo'),starFactor={clear:1,cloudy:.34,rain:.04,snow:.48,stardust:1}[state.weather]||1;if(stars)stars.material.opacity=nightAmount*starFactor*.9;if(moon){const moonAngle=angle+Math.PI;moon.position.set(Math.cos(moonAngle)*39,Math.sin(moonAngle)*31+16,Math.sin(moonAngle*.75)*34);moon.material.opacity=nightAmount*.96;moon.visible=nightAmount>.02}if(halo){halo.position.copy(moon.position);halo.material.opacity=nightAmount*.12;halo.visible=nightAmount>.02}}}
  function updateAtmosphere(dt,t){if(!weatherEffect)return;const rain=weatherEffect.getObjectByName('rain');if(rain?.visible){const positions=rain.geometry.attributes.position.array;for(let i=0;i<positions.length;i+=6){positions[i+1]-=dt*19;positions[i+4]-=dt*19;if(positions[i+1]<1){positions[i+1]=27+(i%17)*.13;positions[i+4]=positions[i+1]-.9}}rain.geometry.attributes.position.needsUpdate=true}const snow=weatherEffect.getObjectByName('snow');if(snow?.visible){const positions=snow.geometry.attributes.position.array;for(let i=0;i<positions.length;i+=3){positions[i+1]-=dt*(1.2+(i%7)*.12);positions[i]+=Math.sin(t*.6+i)*dt*.3;if(positions[i+1]<1)positions[i+1]=34+(i%13)*.18}snow.geometry.attributes.position.needsUpdate=true}const stars=weatherEffect.getObjectByName('stars');if(stars)stars.rotation.y=t*.003;const dust=weatherEffect.getObjectByName('stardust');if(dust?.visible){dust.rotation.y=t*.025;dust.rotation.x=Math.sin(t*.08)*.04}const aurora=weatherEffect.getObjectByName('aurora');if(aurora?.visible){const p=aurora.geometry.attributes.position;for(let i=0;i<p.count;i++){const u=i/(p.count-1);p.setY(i,30+Math.sin(u*TAU*1.5+t*.2)*2.2);p.setZ(i,-38+Math.sin(u*TAU+t*.14)*3)}p.needsUpdate=true}}
  function nearest(list,max=2.3){let best=null,bd=max;for(const g of list){if(!g.parent)continue;const d=player.position.distanceTo(g.position);if(d<bd){bd=d;best=g}}return best}
  function collect(){const g=nearest(pickups,2.4);if(!g){toast('靠近发光物件再按 E');return}state[g.userData.type==='seed'?'seeds':g.userData.type]++;state.collected.push(g.userData.id);g.parent.remove(g);const idx=pickups.indexOf(g);if(idx>=0)pickups.splice(idx,1);toast('收集 '+(g.userData.type==='wood'?'木材':g.userData.type==='stone'?'石头':'发光种子'));updateResourceUI()}
  function placeCraft(type,restore=null){const cost=type==='campfire'?{wood:3,stone:2}:{wood:4,stone:1};if(!restore&&(state.wood<cost.wood||state.stone<cost.stone)){toast('资源还不够：需要 '+cost.wood+'木 · '+cost.stone+'石');return}if(!restore){state.wood-=cost.wood;state.stone-=cost.stone;state.crafted++}const g=new THREE.Group();const x=restore?.x??player.position.x,z=restore?.z??player.position.z;g.position.set(x,terrainHeight(x,z),z);if(type==='campfire'){for(let i=0;i<6;i++){const log=new THREE.Mesh(new THREE.CylinderGeometry(.12,.14,.9,7),mats.wood);log.rotation.set(0, i*TAU/6,Math.PI/2);log.position.y=.18;g.add(log)}const fire=new THREE.Mesh(new THREE.SphereGeometry(.3,8,6),mats.fire);fire.scale.y=1.7;fire.position.y=.7;g.add(fire);g.userData.fire=fire;dynamic.push(g)}else{const seat=new THREE.Mesh(new THREE.CylinderGeometry(.24,.28,1.5,8),mats.bench);seat.rotation.z=Math.PI/2;seat.position.y=.55;g.add(seat);for(const x of [-.53,.53]){const leg=new THREE.Mesh(new THREE.CylinderGeometry(.1,.12,.6,7),mats.wood);leg.position.set(x,.22,0);g.add(leg)}}g.userData.placeType=type;meshWithOutline(g,1.07);scene.add(g);props.push(g);if(!restore)state.placed.push({type,x,z});if(!restore)toast(type==='campfire'?'篝火已点亮':'长凳已放下');updateResourceUI()}
  function plant(restore=null){if(!restore&&state.seeds<1){toast('还没有发光种子');return}const x=restore?.x??player.position.x+(rand()-.5)*1.8,z=restore?.z??player.position.z+(rand()-.5)*1.8;if(Math.hypot(x,z)>37){toast('请在岛屿内部种植');return}if(!restore){state.seeds--;state.planted++;state.placed.push({type:'flower',x,z})}const flower=makeFlower(x,z,'plant');plants.push(flower);if(!restore)toast('一朵花在这里扎根');updateResourceUI()}
  function sculpt(mode){if(activeFantasyVehicle()){toast('请先下车再塑形');return}const cx=player.position.x,cz=player.position.z;if(Math.hypot(cx,cz)>37){toast('海浪边缘无法塑形');return}const radius=5;if(mode==='smooth'){let total=0,count=0;for(let a=0;a<12;a++){const ang=a*TAU/12;total+=terrainHeight(cx+Math.cos(ang)*radius*.65,cz+Math.sin(ang)*radius*.65);count++}state.terrainOps.push({type:'smooth',x:cx,z:cz,radius,amount:.3,target:total/count})}else state.terrainOps.push({type:mode,x:cx,z:cz,radius,amount:mode==='raise'?.45:-.45});const pos=world.terrain.geometry.attributes.position;for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i);pos.setY(i,terrainHeight(x,z))}pos.needsUpdate=true;world.terrain.geometry.computeVertexNormals();const hull=world.terrain.userData.outline;if(hull){hull.geometry.dispose();hull.geometry=world.terrain.geometry.clone()}for(const g of [...props,...plants]){if(g.userData.fantasyGround===undefined)g.position.y=terrainHeight(g.position.x,g.position.z)}for(const g of pickups)g.userData.baseY=terrainHeight(g.position.x,g.position.z)+.5;refreshFantasyGround();state.terrainEdits++;toast(mode==='raise'?'地形向上长了一点':mode==='lower'?'地形向下沉了一点':'地形变得更柔和了');}
  function jump(){if(!activeFantasyVehicle()&&onGround){playerVelocity.y=8.2;onGround=false;state.jumped=true}}
  function movePlayer(dt){if(moveFantasyVehicle(dt))return;let x=0,z=0;if(keys.has('KeyW')||keys.has('ArrowUp'))z-=1;if(keys.has('KeyS')||keys.has('ArrowDown'))z+=1;if(keys.has('KeyA')||keys.has('ArrowLeft'))x-=1;if(keys.has('KeyD')||keys.has('ArrowRight'))x+=1;const previous=player.position.clone();const len=Math.hypot(x,z)||1;const speed=8;player.position.x+=x/len*speed*dt;player.position.z+=z/len*speed*dt;resolveTownCollision(player.position,previous);const r=Math.hypot(player.position.x,player.position.z);if(r>40){player.position.x*=40/r;player.position.z*=40/r}playerVelocity.y-=21*dt;player.position.y+=playerVelocity.y*dt;const floor=terrainHeight(player.position.x,player.position.z)+.03;if(player.position.y<=floor){player.position.y=floor;playerVelocity.y=0;onGround=true}else onGround=false;if(x||z)player.rotation.y=Math.atan2(x,z);}
  const cameraTarget=new THREE.Vector3(),cameraPosition=new THREE.Vector3();
  function updateCamera(dt){if(state.camera==='follow'){cameraTarget.set(player.position.x,player.position.y+1,player.position.z);cameraPosition.set(player.position.x+48,player.position.y+43,player.position.z+48);camera.position.lerp(cameraPosition,1-Math.pow(.001,dt));camera.lookAt(cameraTarget)}else{const ang=elapsed*.085;cameraPosition.set(Math.cos(ang)*75,51,Math.sin(ang)*75);camera.position.lerp(cameraPosition,1-Math.pow(.001,dt));camera.lookAt(0,1,0)}}
  function updateDynamics(t){for(const g of dynamic){if(g===world?.water?.water){g.material.opacity=.46+Math.sin(t*1.4)*.05;g.scale.setScalar(1+Math.sin(t*.8)*.006)}else if(g.userData.baseX!==undefined){g.position.x=g.userData.baseX+Math.sin(t*g.userData.speed*.18)*3;g.position.y+=Math.sin(t*.3+g.position.z)*.0005}else if(g.userData.type){g.position.y=g.userData.baseY+Math.sin(t*2.8+g.position.x)*.16}else if(g.userData.fire){g.userData.fire.scale.y=1.55+Math.sin(t*8)*.22}}for(let i=0;i<world.water.rings.length;i++)world.water.rings[i].scale.setScalar(1+Math.sin(t*1.4+i)*.018)}
  function snapshot(){return {...state,version:2,seed:state.seed,vehicles:captureVehicles(),player:{x:player.position.x,y:player.position.y,z:player.position.z},collected:[...state.collected]}}
  function save(){localStorage.setItem('floating-isle-save',JSON.stringify(snapshot()));toast('进度已保存到本机')}
  function restoreData(data){if(!data||typeof data!=='object'||typeof data.seed!=='string')throw new Error('invalid save');Object.assign(state,data);state.terrainOps=Array.isArray(data.terrainOps)?data.terrainOps:[];state.placed=Array.isArray(data.placed)?data.placed:[];state.collected=Array.isArray(data.collected)?data.collected:[];state.weather=['clear','cloudy','rain','snow','stardust'].includes(data.weather)?data.weather:'clear';state.riding=typeof data.riding==='string'?data.riding:'';state.time=Number.isFinite(data.time)?data.time:10.5;$('seed').value=state.seed;buildWorld(false);if(data.player&&Number.isFinite(data.player.x)&&Number.isFinite(data.player.z))player.position.set(THREE.MathUtils.clamp(data.player.x,-40,40),Number.isFinite(data.player.y)?data.player.y:2,THREE.MathUtils.clamp(data.player.z,-40,40));restoreVehicles(Array.isArray(data.vehicles)?data.vehicles:[]);state.wood=Number(data.wood)||0;state.stone=Number(data.stone)||0;state.seeds=Number(data.seeds)||0;setTime(state.time);setWeather(state.weather,false);$('outline').checked=state.outline;$('autoTime').textContent='时间：'+(state.autoTime?'自动':'手动');$('camera').textContent='视角：'+(state.camera==='follow'?'跟随':'自转');playerVelocity.set(0,0,0);toggleOutlines();updateResourceUI();updateRideUI();updateLocationStatus()}
  function load(){const raw=localStorage.getItem('floating-isle-save');if(!raw){toast('还没有保存记录');return}try{restoreData(JSON.parse(raw));toast('已读取 '+state.seed)}catch(e){toast('保存文件不可用')}}
  function exportJSON(){const blob=new Blob([JSON.stringify({...state,seed:$('seed').value},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='floating-isle-save.json';a.click();URL.revokeObjectURL(a.href);toast('JSON 已导出')}
  function toggleOutlines(){state.outline=$('outline').checked;for(const h of outlines)h.visible=state.outline}
  $('regen').onclick=buildWorld;$('save').onclick=save;$('load').onclick=load;$('export').onclick=()=>{const blob=new Blob([JSON.stringify(snapshot(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='floating-isle-save.json';a.click();URL.revokeObjectURL(a.href);toast('JSON 已导出')};$('import').onclick=()=>$('importFile').click();$('importFile').onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{restoreData(JSON.parse(reader.result));toast('JSON 世界已导入')}catch(err){toast('JSON 格式不正确')}};reader.readAsText(file)};
  $('outline').onchange=toggleOutlines;$('camera').onclick=()=>{state.camera=state.camera==='follow'?'orbit':'follow';$('camera').textContent='视角：'+(state.camera==='follow'?'跟随':'自转');toast(state.camera==='follow'?'镜头跟随角色':'镜头开始自转')};$('autoTime').onclick=()=>{state.autoTime=!state.autoTime;$('autoTime').textContent='时间：'+(state.autoTime?'自动':'手动');toast(state.autoTime?'昼夜开始流转':'时间已锁定')};$('time').oninput=e=>{state.autoTime=false;$('autoTime').textContent='时间：手动';setTime(Number(e.target.value));updateLighting(0);updateLocationStatus()};$('weather').onchange=e=>setWeather(e.target.value);$('vehicle').onchange=updateRideUI;$('ride').onclick=toggleRide;$('summon').onclick=summonVehicle;$('zoom').oninput=e=>{cameraSpan=Number(e.target.value);const a=innerWidth/innerHeight;const h=cameraSpan/a;camera.left=-cameraSpan/2;camera.right=cameraSpan/2;camera.top=h/2;camera.bottom=-h/2;camera.updateProjectionMatrix()};$('raise').onclick=()=>sculpt('raise');$('lower').onclick=()=>sculpt('lower');$('smooth').onclick=()=>sculpt('smooth');$('campfire').onclick=()=>placeCraft('campfire');$('bench').onclick=()=>placeCraft('bench');$('plant').onclick=()=>plant();$('shot').onclick=()=>{const a=document.createElement('a');a.download='floating-isle.png';a.href=renderer.domElement.toDataURL('image/png');a.click();toast('截图已保存')};
  addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;keys.add(e.code);if(e.code==='Space'){e.preventDefault();if(activeFantasyVehicle()?.id==='airship')return;jump()}if(e.code==='KeyE')collect();if(e.code==='KeyV')toggleRide();if(e.code==='KeyP')plant();if(e.code==='KeyC')placeCraft('campfire');if(e.code==='KeyB')placeCraft('bench');if(e.code==='KeyR')sculpt('raise');if(e.code==='KeyF')sculpt('lower');if(e.code==='KeyG')sculpt('smooth')});addEventListener('keyup',e=>keys.delete(e.code));
  addEventListener('resize',()=>{const a=innerWidth/innerHeight;const h=cameraSpan/a;camera.left=-cameraSpan/2;camera.right=cameraSpan/2;camera.top=h/2;camera.bottom=-h/2;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
  for(const button of document.querySelectorAll('#touchControls [data-dir]')){const code={up:'KeyW',down:'KeyS',left:'KeyA',right:'KeyD'}[button.dataset.dir];button.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(code);button.setPointerCapture(e.pointerId)});for(const event of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(event,()=>keys.delete(code))}for(const button of document.querySelectorAll('#touchControls [data-action]'))button.addEventListener('click',()=>({jump,collect,plant,ride:toggleRide}[button.dataset.action])());

  function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04);elapsed+=dt;movePlayer(dt);updateLighting(dt);updateAtmosphere(dt,elapsed);updateFantasyWorld(dt,elapsed,nightAmount);updateCamera(dt);updateDynamics(elapsed);if(elapsed-statusClock>.2){statusClock=elapsed;updateLocationStatus()}renderer.render(scene,camera)} loop();
})();
