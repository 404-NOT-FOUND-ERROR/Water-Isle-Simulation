<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="eureka:viewport" content='{"mode":"responsive"}'><meta name="theme-color" content="#d7e9dc"><title>给水一条路</title><style>/* STYLES */</style></head>
<body data-mode="intro" data-phase="build"><main id="app">
<section class="stage-wrap" aria-label="云铃镇河谷"><div id="scene"></div><div id="labels"></div><div id="spots" class="play-hud"></div><div id="workBubble" class="play-hud" hidden></div>
<button id="gateMapBtn" class="gate-map play-hud" hidden>调水闸 ↗</button>
<div id="phaseNotice" class="phase-notice play-hud" hidden role="status"><strong id="phaseNoticeTitle"></strong><span id="phaseNoticeText"></span></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="opening" hidden><button id="skipIntro" class="skip-intro">跳过 →</button><div class="opening-top">云铃镇 · 一个雨天</div><div class="opening-caption"><h2 id="openingTitle">河水经过小镇，流向远方。</h2><p id="openingText">桥上的早市，刚刚开始。</p><div class="story-progress"><i id="openingProgress"></i></div></div></div>
<div id="home" hidden><div class="home-kicker">A LITTLE RIVER. A BIG ADVENTURE.</div><h1>给水<br>一条路</h1><p>下一场雨来之前，<br>你会怎样救回云铃镇？</p><button id="beginBtn" class="primary">回到下雨前 →</button><div class="home-detail"><span>挖河道</span><span>筑护岸</span><span>给水找个家</span></div></div>
<div id="loading" class="loading"><strong>云铃镇正在醒来</strong><p>河水流过山谷，故事就要开始。</p></div><div id="fallback" class="fallback" hidden><h2>开启岛屿画面</h2><p>请在浏览器设置中开启硬件加速，再打开小岛。</p><button onclick="location.reload()">打开小岛</button></div></section>
<header><div class="brand"><span class="brand-icon" data-icon="island"></span><strong>给水一条路</strong></div><nav class="header-actions" aria-label="旅程导航"><button id="reportBtn" hidden>回看</button><button id="mapBtn">旅程</button><button id="nextLevelBtn" class="play-hud">下一关 →</button></nav></header>
<nav class="tool-rail play-hud" aria-label="施工与观察工具">
<button id="chooseWork" class="tool" data-icon="book" aria-label="选择工程"><span>工程</span></button><span class="tool-divider"></span>
<button class="tool" data-tool="dig" aria-pressed="true" data-icon="dig"><span>挖低</span></button>
<button class="tool" data-tool="raise" aria-pressed="false" data-icon="raise"><span>堆高</span></button>
<button class="tool" data-tool="look" aria-pressed="false" data-icon="hand"><span>观察</span></button>
<button id="gateBtn" class="tool gate-tool" data-icon="gate" aria-label="水闸" aria-controls="gateControls" aria-expanded="false" hidden><span>水闸</span><small id="gateDockValue">待建</small></button>
<span class="tool-divider"></span><button id="undoBtn" class="tool" data-icon="undo" aria-label="撤销施工" disabled></button><button id="settingsBtn" class="tool" data-icon="toolbox" aria-label="工具箱"></button>
</nav>
<section class="mission float-panel play-hud" aria-label="本关目标">
<details id="missionDetails" open><summary><span id="chapterLabel" class="eyebrow"></span><strong id="missionTitle"></strong><span class="details-chevron">⌄</span></summary><div id="taskText" class="goal"></div><div id="crewStatus" class="crew-status" hidden></div></details>
<div id="phaseRail" class="phase-rail"></div><button id="runBtn" class="primary" data-icon="rain">让雨来吧</button>
<div class="playback-actions" id="playbackActions" hidden><button id="advanceBtn">跳到结算 ↗</button><button id="rebuildBtn">返回施工</button></div>
<div class="progress"><i id="progress"></i></div><div class="playback-caption"><span id="weatherText">准备施工</span><span id="runTime"></span></div>
</section>
<section id="guidanceDock" class="guidance-dock float-panel play-hud" aria-label="工程提示">
<div class="work-card"><div class="work-top"><span id="workNumber" class="work-number">01</span><strong id="workTitle">拓宽主河道</strong><button id="workBtn" class="secondary">开工</button></div><p id="workTip"></p></div>
<button id="learnToggle" class="learn-toggle" aria-expanded="false" aria-controls="lessonCard"><span data-icon="flow"></span>看看水怎么走 <span>⌄</span></button>
<section id="lessonCard" class="lesson-card" aria-live="polite"></section>
</section>
<section id="gateControls" hidden aria-label="水闸控制" class="gate-controls play-hud"><div class="gate-heading"><div><small>蓄水 / 下泄</small><strong>水闸 <span id="gatePercent">50%</span></strong><span id="gatePause" class="gate-pause" hidden>已暂停</span></div><button id="gateClose" aria-label="收起水闸">×</button></div><div id="gateSection"></div><div id="gateSteps" class="gate-steps" role="group" aria-label="闸门开度"><button data-opening="0" aria-label="关闸 0%">关闸</button><button data-opening="25" aria-label="开闸 25%">25%</button><button data-opening="50" aria-label="半开 50%">半开</button><button data-opening="75" aria-label="开闸 75%">75%</button><button data-opening="100" aria-label="全开 100%">全开</button></div><p id="gateHint" class="gate-hint">关小蓄水 · 开大下泄</p><button id="gateBuild" class="primary" hidden>取土筑坝 →</button><div class="gate-readings"><span id="gateStorage"></span><span id="gateFlow"></span></div><div id="gateStatus"></div></section>
<div class="view-buttons play-hud"><button id="zoomBtn" class="icon-button" data-icon="zoom" aria-label="放大地图"></button><button id="fitBtn" class="icon-button" data-icon="fit" aria-label="全岛视角"></button></div>
<div hidden aria-hidden="true"><div class="map-heading"><b></b><span></span></div><div id="liveCompare"></div><div id="waterNote"></div><div id="mobileMission"></div><div id="mobileStat"></div><button id="mobileRun"></button><button id="mobileInfo"></button><div id="missionDesc"></div><div id="townStat"></div><div id="downStat"></div><div id="basinStat"></div><div id="extraStat"></div><div><b id="scienceTitle"></b><span id="scienceText"></span></div><span id="runState"></span></div>
</main>
<dialog id="infoDialog"><div class="dialog-head"><h2 id="infoTitle"></h2><button class="icon-button close-dialog" data-icon="close" aria-label="关闭"></button></div><div id="infoBody"></div></dialog>
<dialog id="mapDialog"><div class="dialog-head"><h2>河谷旅程</h2><button class="icon-button close-dialog" data-icon="close" aria-label="关闭"></button></div><div id="levelCards" class="chapter-list"></div></dialog>
<dialog id="resultDialog" aria-labelledby="resultTitle"><div class="result-scroll"><div class="result-hero"><button class="icon-button close-dialog result-close" data-icon="close" aria-label="关闭"></button><div class="result-orbit" aria-hidden="true"><svg viewBox="0 0 160 100"><path class="result-land" d="M24 66 80 39 136 66 80 94Z"/><path class="result-house" d="M60 65V43L80 28 100 43V65M72 65V51H87V65"/><path class="result-wave" d="M5 72Q25 57 45 72T85 72T125 72T165 72"/></svg></div><div id="resultKicker" class="eyebrow"></div><h2 id="resultTitle"></h2><div id="resultStars" class="result-stars"></div><p id="resultDesc"></p></div>
<div class="result-body"><div id="resultMetrics" class="result-metrics"></div><div id="resultLearning"></div><details id="resultEvidence"><summary>看看水路的变化 <span>↗</span></summary><div id="comparison"></div></details></div></div>
<div class="result-actions"><button id="retryBtn">继续改造</button><button id="restartBtn">从头再来</button><button id="nextBtn" class="primary">下一关 →</button></div></dialog>
<dialog id="settingsDialog"><div class="dialog-head"><h2>工地工具箱</h2><button class="icon-button close-dialog" data-icon="close" aria-label="关闭"></button></div><div class="settings-row"><label for="brush">笔刷大小</label><input id="brush" type="range" min="1.2" max="5" step=".2" value="2.8"></div><div class="settings-row"><label for="weatherChoice">自由岛天气</label><select id="weatherChoice"><option value="6">阵雨</option><option value="18" selected>暴雨</option><option value="28">强降雨</option></select></div><div class="dialog-actions"><button id="pauseBtn">暂停水流</button><button id="flatBtn">平整工具</button></div><div class="dialog-actions"><button id="saveBtn">保存</button><button id="loadBtn">读取</button><button id="resetBtn">重整本关</button></div><div class="dialog-actions"><button id="helpBtn">玩法</button></div></dialog>
<script type="module">/* BUNDLE */</script></body></html>
